<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PharmaTrack - Manage Medicines</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F9FCFB;
            color: #1F2937;
        }

        /* HEADER */
        header {
            background-color: #006D5B;
            color: #FFFFFF;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        nav a {
            color: #FFFFFF;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: #10B981;
        }

        nav a.active {
            background-color: #FFFFFF;
            color: #006D5B;
            font-weight: bold;
        }

        /* MAIN */
        main {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            color: #006D5B;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .page-title h2 {
            color: #006D5B;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6B7280;
        }

        /* FORM */
        .form-box {
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
        }

        .form-box h3 {
            color: #006D5B;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #10B981;
        }

        .submit-button {
            width: 100%;
            padding: 11px;
            background-color: #006D5B;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .submit-button:hover {
            background-color: #10B981;
        }

        /* TABLE */
        .table-box {
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            overflow-x: auto;
        }

        .table-box h3 {
            color: #006D5B;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #E6F7F3;
            color: #006D5B;
            text-align: left;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-top: 1px solid #E2E8F0;
        }

        .edit-button {
            background-color: #10B981;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-button {
            background-color: #DC2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-button:hover {
            opacity: 0.85;
        }

        .delete-button:hover {
            opacity: 0.85;
        }

        .empty-message {
            text-align: center;
            color: #6B7280;
            padding: 20px;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            header {
                flex-direction: column;
                gap: 10px;
            }

            nav {
                width: 100%;
                justify-content: center;
            }

            main {
                width: 92%;
                margin: 25px auto;
            }

            .page-title h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>💊 PharmaTrack</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="medicines.html" class="active">Medicines</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <main>

        <!-- BACK -->
        <a href="dashboard.html" class="back-button">
            ← Back to Dashboard
        </a>


        <!-- TITLE -->
        <section class="page-title">

            <h2>Manage Medicines</h2>

            <p>
                Add, edit, and delete medicine information.
            </p>

        </section>


        <!-- ADD MEDICINE FORM -->
        <div class="form-box">

            <h3 id="formTitle">Add Medicine</h3>

            <form id="medicineForm">

                <div class="form-group">

                    <label for="medicineName">
                        Medicine Name
                    </label>

                    <input
                        type="text"
                        id="medicineName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Analgesics / Painkillers">
                            Analgesics / Painkillers
                        </option>

                        <option value="Antipyretics">
                            Antipyretics
                        </option>

                        <option value="Antihistamines">
                            Antihistamines
                        </option>

                        <option value="Decongestants">
                            Decongestants
                        </option>

                        <option value="Mucolytics">
                            Mucolytics
                        </option>

                        <option value="Antacids">
                            Antacids
                        </option>

                        <option value="Antidiarrheals">
                            Antidiarrheals
                        </option>

                        <option value="Antibiotics">
                            Antibiotics
                        </option>

                        <option value="Antiseptics">
                            Antiseptics
                        </option>

                        <option value="Topical Antibiotics">
                            Topical Antibiotics
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="stock">
                        Available Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="expiration">
                        Expiration Date
                    </label>

                    <input
                        type="date"
                        id="expiration"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton"
                >
                    Add Medicine
                </button>

            </form>

        </div>


        <!-- MEDICINE TABLE -->
        <div class="table-box">

            <h3>Medicine List</h3>

            <table>

                <thead>

                    <tr>
                        <th>Medicine Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Expiration Date</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="medicineTable">

                </tbody>

            </table>

        </div>

    </main>


    <script>

        const form = document.getElementById("medicineForm");

        const medicineTable =
            document.getElementById("medicineTable");

        const formTitle =
            document.getElementById("formTitle");

        const submitButton =
            document.getElementById("submitButton");


        let medicines =
            JSON.parse(localStorage.getItem("pharmaTrackMedicines")) || [];

        let editIndex = -1;


        /* DISPLAY MEDICINES */

        function displayMedicines() {

            medicineTable.innerHTML = "";

            if (medicines.length === 0) {

                medicineTable.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-message">
                            No medicines added yet.
                        </td>
                    </tr>
                `;

                return;
            }


            medicines.forEach(function(medicine, index) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `
                    <td>${medicine.name}</td>

                    <td>${medicine.category}</td>

                    <td>₱${parseFloat(medicine.price).toFixed(2)}</td>

                    <td>${medicine.stock}</td>

                    <td>${medicine.expiration}</td>

                    <td>
                        <button
                            class="edit-button"
                            onclick="editMedicine(${index})">
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteMedicine(${index})">
                            Delete
                        </button>
                    </td>
                `;


                medicineTable.appendChild(row);

            });

        }


        /* ADD / UPDATE MEDICINE */

        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const medicine = {

                name:
                    document.getElementById("medicineName").value,

                category:
                    document.getElementById("category").value,

                price:
                    document.getElementById("price").value,

                stock:
                    document.getElementById("stock").value,

                expiration:
                    document.getElementById("expiration").value

            };


            if (editIndex === -1) {

                /* ADD */

                medicines.push(medicine);

            } else {

                /* UPDATE */

                medicines[editIndex] = medicine;

                editIndex = -1;

                formTitle.textContent = "Add Medicine";

                submitButton.textContent = "Add Medicine";

            }


            localStorage.setItem(
                "pharmaTrackMedicines",
                JSON.stringify(medicines)
            );


            form.reset();

            displayMedicines();

        });


        /* EDIT */

        function editMedicine(index) {

            const medicine =
                medicines[index];


            document.getElementById("medicineName").value =
                medicine.name;

            document.getElementById("category").value =
                medicine.category;

            document.getElementById("price").value =
                medicine.price;

            document.getElementById("stock").value =
                medicine.stock;

            document.getElementById("expiration").value =
                medicine.expiration;


            editIndex = index;


            formTitle.textContent = "Edit Medicine";

            submitButton.textContent = "Update Medicine";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* DELETE */

        function deleteMedicine(index) {

            if (
                confirm(
                    "Are you sure you want to delete this medicine?"
                )
            ) {

                medicines.splice(index, 1);


                localStorage.setItem(
                    "pharmaTrackMedicines",
                    JSON.stringify(medicines)
                );


                displayMedicines();

            }

        }


        /* LOAD SAVED DATA */

        displayMedicines();

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PharmaTrack - Categories</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F9FCFB;
            color: #1F2937;
        }

        /* HEADER */
        header {
            background-color: #006D5B;
            color: #FFFFFF;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        nav a {
            color: #FFFFFF;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: #10B981;
        }

        nav a.active {
            background-color: #FFFFFF;
            color: #006D5B;
            font-weight: bold;
        }

        /* MAIN */
        main {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            color: #006D5B;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .page-title h2 {
            color: #006D5B;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6B7280;
        }

        /* CATEGORY CARDS */
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .category-card {
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 20px;
        }

        .category-card h3 {
            color: #006D5B;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .medicine-list {
            margin: 0;
            padding-left: 25px;
        }

        .medicine-list li {
            margin-bottom: 8px;
        }

        .no-medicine {
            color: #6B7280;
            font-style: italic;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            header {
                flex-direction: column;
                gap: 10px;
            }

            nav {
                width: 100%;
                justify-content: center;
            }

            main {
                width: 92%;
                margin: 25px auto;
            }

            .page-title h2 {
                font-size: 25px;
            }

            .categories {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>💊 PharmaTrack</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>

            <a href="categories.html" class="active">
                Categories
            </a>

            <a href="login.html">
                Logout
            </a>
        </nav>

    </header>


    <main>

        <!-- BACK -->
        <a href="dashboard.html" class="back-button">
            ← Back to Dashboard
        </a>


        <!-- TITLE -->
        <section class="page-title">

            <h2>Medicine Categories</h2>

            <p>
                Medicines are automatically organized according to their category.
            </p>

        </section>


        <!-- CATEGORIES -->
        <section
            class="categories"
            id="categoriesContainer">
        </section>

    </main>


    <script>

        /* GET SAVED MEDICINES */

        const medicines =
            JSON.parse(
                localStorage.getItem("pharmaTrackMedicines")
            ) || [];


        /* OUR FIXED CATEGORIES */

        const categories = [

            "Analgesics / Painkillers",

            "Antipyretics",

            "Antihistamines",

            "Decongestants",

            "Mucolytics",

            "Antacids",

            "Antidiarrheals",

            "Antibiotics",

            "Antiseptics",

            "Topical Antibiotics",

            "Other"

        ];


        const container =
            document.getElementById("categoriesContainer");


        /* DISPLAY CATEGORIES */

        categories.forEach(function(category) {


            /* Find medicines under this category */

            const categoryMedicines =
                medicines.filter(function(medicine) {

                    return medicine.category === category;

                });


            const card =
                document.createElement("div");

            card.className = "category-card";


            let medicineHTML = "";


            if (categoryMedicines.length === 0) {

                medicineHTML = `
                    <p class="no-medicine">
                        No medicines added yet.
                    </p>
                `;

            } else {

                medicineHTML = `
                    <ul class="medicine-list">
                `;


                categoryMedicines.forEach(function(medicine) {

                    medicineHTML += `
                        <li>${medicine.name}</li>
                    `;

                });


                medicineHTML += `
                    </ul>
                `;

            }


            card.innerHTML = `

                <h3>📁 ${category}</h3>

                ${medicineHTML}

            `;


            container.appendChild(card);

        });

    </script>

</body>

</html>
